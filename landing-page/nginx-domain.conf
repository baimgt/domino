# ==============================================================================
# NGINX CONFIGURATION: NEXT.JS LANDING PAGE + NODE.JS BACKEND (SOCKET.IO)
# ==============================================================================
# Salin konfigurasi ini ke Ubuntu VPS Anda: /etc/nginx/sites-available/kings.conf
# Ganti "namadomainanda.com" dengan nama domain Anda yang sebenarnya!

# 1. SERVER UNTUK WEBSITE PROMOSI & DOWNLOAD APK (Next.js Port 3000)
server {
    listen 80;
    server_name namadomainanda.com www.namadomainanda.com;

    # Meningkatkan limit upload dan timeout untuk file APK besar
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Caching aset publik (APK & Gambar) agar super cepat
    location /assets/ {
        proxy_pass http://127.0.0.1:3000/assets/;
        proxy_set_header Host $host;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

# 2. SERVER UNTUK BACKEND GAME & SOCKET.IO (Node.js Port 8080)
# Pemain di game APK akan terhubung ke: https://api.namadomainanda.com
server {
    listen 80;
    server_name api.namadomainanda.com;

    client_max_body_size 50M;

    # Proxy untuk REST API
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy khusus WebSocket Socket.IO (Wajib untuk game realtime anti putus-putus)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:8080/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
