<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03453d"/>
      <stop offset="0.35" stop-color="#0a8f78"/>
      <stop offset="0.65" stop-color="#17b894"/>
      <stop offset="1" stop-color="#05503f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffe9a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb58a"/>
      <stop offset="1" stop-color="#075a46"/>
    </linearGradient>
    <linearGradient id="pillar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a0f12"/>
      <stop offset="0.5" stop-color="#d12a2a"/>
      <stop offset="1" stop-color="#6a0b0e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a8"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#a8741a"/>
    </linearGradient>
    <radialGradient id="lantern" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ff9a6a"/>
      <stop offset="0.5" stop-color="#e02828"/>
      <stop offset="1" stop-color="#8a0a14"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c9a80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#022e27"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="1" stop-color="#cfe9dc"/>
    </linearGradient>
    <linearGradient id="tileBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21c79a"/>
      <stop offset="1" stop-color="#0a7a60"/>
    </linearGradient>
    <filter id="blur30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur12" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur4" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>

    <!-- 3-tier pavilion -->
    <g id="pavilion">
      <rect x="-95" y="-70" width="190" height="160" fill="#063d33"/>
      <rect x="-80" y="-60" width="14" height="150" fill="url(#pillar)"/>
      <rect x="66" y="-60" width="14" height="150" fill="url(#pillar)"/>
      <rect x="-8" y="-60" width="16" height="150" fill="url(#pillar)"/>
      <rect x="-66" y="-40" width="58" height="90" fill="#0b2c27"/>
      <rect x="8" y="-40" width="58" height="90" fill="#0b2c27"/>
      <path d="M-170,-70 C-120,-70 -100,-80 -78,-120 L78,-120 C100,-80 120,-70 170,-70 Q85,-52 0,-52 Q-85,-52 -170,-70 Z" fill="url(#roof)" stroke="url(#gold)" stroke-width="5"/>
      <rect x="-70" y="-190" width="140" height="68" fill="#063d33"/>
      <rect x="-58" y="-182" width="12" height="60" fill="url(#pillar)"/>
      <rect x="46" y="-182" width="12" height="60" fill="url(#pillar)"/>
      <path d="M-140,-190 C-100,-190 -85,-200 -66,-236 L66,-236 C85,-200 100,-190 140,-190 Q70,-174 0,-174 Q-70,-174 -140,-190 Z" fill="url(#roof)" stroke="url(#gold)" stroke-width="5"/>
      <rect x="-42" y="-290" width="84" height="56" fill="#063d33"/>
      <path d="M-105,-290 C-72,-290 -62,-298 -48,-330 L48,-330 C62,-298 72,-290 105,-290 Q52,-276 0,-276 Q-52,-276 -105,-290 Z" fill="url(#roof)" stroke="url(#gold)" stroke-width="5"/>
      <path d="M-6,-330 L0,-372 L6,-330 Z" fill="url(#gold)"/>
      <circle cx="0" cy="-376" r="7" fill="url(#gold)"/>
      <circle cx="-170" cy="-70" r="6" fill="url(#gold)"/><circle cx="170" cy="-70" r="6" fill="url(#gold)"/>
      <circle cx="-140" cy="-190" r="5" fill="url(#gold)"/><circle cx="140" cy="-190" r="5" fill="url(#gold)"/>
    </g>

    <g id="lantern">
      <circle r="60" fill="url(#lanternGlow)"/>
      <rect x="-5" y="-34" width="10" height="10" fill="url(#gold)"/>
      <ellipse cx="0" cy="0" rx="22" ry="26" fill="url(#lantern)" stroke="#ffd36a" stroke-width="2"/>
      <path d="M-12,-24 Q0,0 -12,24 M12,-24 Q0,0 12,24 M0,-26 L0,26" stroke="#ffb347" stroke-width="1.5" fill="none" opacity="0.7"/>
      <rect x="-9" y="24" width="18" height="6" fill="url(#gold)"/>
      <path d="M0,30 L0,52 M-4,52 L0,60 L4,52" stroke="#f5c542" stroke-width="2" fill="none"/>
    </g>

    <g id="ingot">
      <path d="M-34,-6 Q-40,-22 -22,-20 Q0,-30 22,-20 Q40,-22 34,-6 L24,16 Q0,24 -24,16 Z" fill="url(#gold)" stroke="#fff3b0" stroke-width="2"/>
      <ellipse cx="0" cy="-12" rx="22" ry="7" fill="#ffe27a" opacity="0.8"/>
    </g>

    <g id="tile3">
      <rect x="-34" y="-46" width="68" height="92" rx="10" fill="url(#tileBack)" stroke="#e8fff5" stroke-width="2"/>
      <rect x="-28" y="-40" width="56" height="80" rx="7" fill="url(#tile)"/>
      <circle cx="0" cy="-18" r="9" fill="#d12a2a"/><circle cx="0" cy="-18" r="4" fill="#fff"/>
      <circle cx="-14" cy="8" r="9" fill="#0f8a6a"/><circle cx="-14" cy="8" r="4" fill="#fff"/>
      <circle cx="14" cy="8" r="9" fill="#0f8a6a"/><circle cx="14" cy="8" r="4" fill="#fff"/>
      <circle cx="0" cy="28" r="7" fill="#d12a2a"/>
    </g>
    <g id="tileBam">
      <rect x="-34" y="-46" width="68" height="92" rx="10" fill="url(#tileBack)" stroke="#e8fff5" stroke-width="2"/>
      <rect x="-28" y="-40" width="56" height="80" rx="7" fill="url(#tile)"/>
      <rect x="-14" y="-30" width="8" height="26" rx="4" fill="#118a62"/><rect x="6" y="-30" width="8" height="26" rx="4" fill="#118a62"/>
      <rect x="-14" y="4" width="8" height="26" rx="4" fill="#d12a2a"/><rect x="6" y="4" width="8" height="26" rx="4" fill="#118a62"/>
    </g>

    <g id="bamboo">
      <rect x="-9" y="0" width="18" height="620" fill="#0d7a52"/>
      <rect x="-9" y="0" width="6" height="620" fill="#2fd39a" opacity="0.6"/>
      <g fill="#0a5c40"><rect x="-11" y="110" width="22" height="7"/><rect x="-11" y="250" width="22" height="7"/><rect x="-11" y="390" width="22" height="7"/><rect x="-11" y="530" width="22" height="7"/></g>
      <path d="M9,120 Q70,90 110,40 Q70,80 9,110 Z M-9,260 Q-70,230 -110,180 Q-70,220 -9,250 Z M9,400 Q70,370 110,320 Q70,360 9,390 Z" fill="#1fb07a"/>
    </g>
  </defs>

  <!-- SKY -->
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="960" cy="440" r="520" fill="url(#moonGlow)"/>

  <!-- soft clouds -->
  <g fill="#c8fff0" opacity="0.28" filter="url(#blur30)">
    <ellipse cx="300" cy="180" rx="260" ry="50"/><ellipse cx="1650" cy="150" rx="300" ry="55"/>
    <ellipse cx="1000" cy="90" rx="340" ry="40"/><ellipse cx="420" cy="620" rx="320" ry="45"/><ellipse cx="1520" cy="640" rx="340" ry="48"/>
  </g>

  <!-- distant mountains -->
  <path d="M0,640 L140,520 L230,580 L360,470 L470,570 L600,500 L720,610 L720,760 L0,760 Z" fill="#0a6a58" opacity="0.55"/>
  <path d="M1200,610 L1320,500 L1440,570 L1560,460 L1690,560 L1800,500 L1920,590 L1920,760 L1200,760 Z" fill="#0a6a58" opacity="0.55"/>
  <path d="M0,700 L180,610 L320,670 L460,600 L620,690 L620,780 L0,780 Z" fill="#064d40" opacity="0.7"/>
  <path d="M1300,690 L1450,610 L1580,670 L1740,600 L1920,680 L1920,780 L1300,780 Z" fill="#064d40" opacity="0.7"/>

  <!-- MOON GATE -->
  <g transform="translate(960,470)">
    <circle r="250" fill="#0a8f78" opacity="0.5" filter="url(#blur12)"/>
    <circle r="210" fill="#fff6c8" opacity="0.92"/>
    <circle r="210" fill="none" stroke="url(#gold)" stroke-width="14"/>
    <circle r="226" fill="none" stroke="#0b5a47" stroke-width="22" opacity="0.85"/>
    <circle r="198" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
    <path d="M-120,40 Q-60,-20 0,30 T130,20" stroke="#8fe3c2" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M-150,100 Q-70,50 10,90 T160,80" stroke="#a6efd0" stroke-width="5" fill="none" opacity="0.5"/>
  </g>

  <!-- distant pavilion behind gate -->
  <g transform="translate(960,640) scale(0.55)" opacity="0.85"><use href="#pavilion"/></g>

  <!-- LEFT PAVILION -->
  <g transform="translate(230,740) scale(1.15)"><use href="#pavilion"/></g>
  <g transform="translate(560,770) scale(0.62)" opacity="0.9"><use href="#pavilion"/></g>
  <!-- RIGHT PAVILION -->
  <g transform="translate(1690,740) scale(1.15)"><use href="#pavilion"/></g>
  <g transform="translate(1360,770) scale(0.62)" opacity="0.9"><use href="#pavilion"/></g>

  <!-- bamboo edges -->
  <g transform="translate(40,0)"><use href="#bamboo"/></g>
  <g transform="translate(95,60) scale(0.9)"><use href="#bamboo"/></g>
  <g transform="translate(1880,0)"><use href="#bamboo"/></g>
  <g transform="translate(1825,60) scale(0.9)"><use href="#bamboo"/></g>

  <!-- hanging lantern strings -->
  <path d="M0,60 Q480,160 960,80 T1920,60" stroke="#f5c542" stroke-width="3" fill="none" opacity="0.8"/>
  <g>
    <use href="#lantern" transform="translate(150,115) scale(1.0)"/>
    <use href="#lantern" transform="translate(420,150) scale(0.9)"/>
    <use href="#lantern" transform="translate(700,135) scale(0.85)"/>
    <use href="#lantern" transform="translate(960,105) scale(0.95)"/>
    <use href="#lantern" transform="translate(1220,135) scale(0.85)"/>
    <use href="#lantern" transform="translate(1500,150) scale(0.9)"/>
    <use href="#lantern" transform="translate(1770,115) scale(1.0)"/>
  </g>
  <g>
    <use href="#lantern" transform="translate(330,560) scale(0.9)"/>
    <use href="#lantern" transform="translate(1590,560) scale(0.9)"/>
  </g>

  <!-- GROUND / WATER -->
  <rect x="0" y="800" width="1920" height="280" fill="url(#water)"/>
  <g stroke="#9ff3d2" stroke-width="2" fill="none" opacity="0.35">
    <path d="M0,850 Q240,835 480,850 T960,850 T1440,850 T1920,850"/>
    <path d="M0,905 Q300,888 600,905 T1200,905 T1800,905 L1920,905"/>
    <path d="M0,960 Q360,942 720,960 T1440,960 T1920,955"/>
  </g>
  <g opacity="0.25" filter="url(#blur4)">
    <ellipse cx="960" cy="900" rx="300" ry="40" fill="#fff3b0"/>
    <ellipse cx="260" cy="880" rx="190" ry="26" fill="#ffb347"/>
    <ellipse cx="1660" cy="880" rx="190" ry="26" fill="#ffb347"/>
  </g>

  <!-- lotus leaves -->
  <g fill="#0f9c6a" opacity="0.9">
    <ellipse cx="520" cy="990" rx="70" ry="16"/><ellipse cx="660" cy="1030" rx="56" ry="13"/>
    <ellipse cx="1380" cy="995" rx="70" ry="16"/><ellipse cx="1250" cy="1035" rx="56" ry="13"/>
  </g>
  <g fill="#ff9ec4"><ellipse cx="520" cy="975" rx="14" ry="20"/><ellipse cx="1380" cy="980" rx="14" ry="20"/></g>

  <!-- floating mahjong tiles & gold ingots -->
  <g>
    <use href="#tile3" transform="translate(330,330) rotate(-18) scale(0.9)"/>
    <use href="#tileBam" transform="translate(1600,300) rotate(16) scale(0.9)"/>
    <use href="#tileBam" transform="translate(620,240) rotate(12) scale(0.6)" opacity="0.8"/>
    <use href="#tile3" transform="translate(1310,230) rotate(-14) scale(0.6)" opacity="0.8"/>
    <use href="#tile3" transform="translate(120,620) rotate(10) scale(0.7)" opacity="0.85"/>
    <use href="#tileBam" transform="translate(1810,640) rotate(-10) scale(0.7)" opacity="0.85"/>
  </g>
  <g>
    <use href="#ingot" transform="translate(470,430) rotate(-10) scale(1.1)"/>
    <use href="#ingot" transform="translate(1470,420) rotate(12) scale(1.1)"/>
    <use href="#ingot" transform="translate(240,880) rotate(-6) scale(0.9)"/>
    <use href="#ingot" transform="translate(1700,900) rotate(8) scale(0.9)"/>
    <use href="#ingot" transform="translate(800,300) rotate(8) scale(0.6)" opacity="0.8"/>
    <use href="#ingot" transform="translate(1130,320) rotate(-8) scale(0.6)" opacity="0.8"/>
  </g>

  <!-- sparkles -->
  <g fill="#fff6c8">
    <circle cx="210" cy="260" r="3"/><circle cx="520" cy="540" r="2.5"/><circle cx="760" cy="180" r="3"/><circle cx="1110" cy="210" r="2.5"/>
    <circle cx="1420" cy="520" r="3"/><circle cx="1710" cy="220" r="3"/><circle cx="880" cy="760" r="2.5"/><circle cx="1060" cy="790" r="3"/>
    <circle cx="90" cy="440" r="2.5"/><circle cx="1830" cy="460" r="2.5"/><circle cx="660" cy="860" r="2"/><circle cx="1280" cy="850" r="2"/>
  </g>

  <!-- vignette -->
  <radialGradient id="vig" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
    <stop offset="1" stop-color="#001a14" stop-opacity="0.6"/>
  </radialGradient>
  <rect width="1920" height="1080" fill="url(#vig)"/>
</svg>
