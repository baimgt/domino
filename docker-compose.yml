version: '3.8'

services:
  # 1. WEB GAME UTAMA -> kingsbilliards.tech (Host Port 5173)
  web_game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kings_web_game
    restart: always
    ports:
      - "5173:80"

  # 2. WEB DOWNLOAD APK -> download.kingsbilliards.tech (Host Port 3000)
  download_web:
    build:
      context: ./landing-page
      dockerfile: Dockerfile
    container_name: kings_download_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

  # 3. BACKEND & SOCKET.IO -> api.kingsbilliards.tech (Host Port 8080)
  backend:
    build:
      context: ./node-backend
      dockerfile: Dockerfile
    container_name: domino_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      MONGO_URI: "mongodb+srv://gamerstore:P1CwEUjy84OiTfAM@gamerstore.yy5ekdc.mongodb.net/domino_db?retryWrites=true&w=majority"

